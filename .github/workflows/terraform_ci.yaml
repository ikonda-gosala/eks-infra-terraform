name: "Provision AWS Cloud Infrastructure"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  terraform:
    name: "Terraform Plan and Apply"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Authenticate via AWS Access Keys
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Initialize HashiCorp Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Format Check
        run: terraform fmt

      - name: Initialize Code Modules
        run: terraform init

      - name: Generate Infrastructure Plan
        run: terraform plan -input=false

      # Uncomment the two lines below when you want GitHub Actions to automatically deploy the infrastructure on every push
      # - name: Deploy Cloud Architecture
      #   run: terraform apply -auto-approve -input=false

      # - name: Destroy terraform
      #   run: terraform destroy -auto-approve -input=false
